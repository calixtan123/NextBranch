name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Match the image to the locked @playwright/test version (1.63.0).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TFL_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.1.1
      - run: npm ci
      - run: npm run check:topology-age
      - run: python -m pytest -q tests/catalogue tests/release
      - run: npm run verify
      - run: npm run build
      - run: npm run test:e2e

  verify-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_NEXTBRANCH_API_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json
      - name: Install shared catalogue dependencies
        run: npm ci --omit=dev
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:ios
