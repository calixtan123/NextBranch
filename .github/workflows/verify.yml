name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TFL_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.1.1
      - run: npm ci
      - run: npm run check:topology-age
      - run: npx playwright install --with-deps chromium webkit
      - run: python -m pytest -q tests/catalogue
      - run: npm run verify
      - run: npm run build
      - run: npm run test:e2e
