name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Keep browser dependencies on a fixed Playwright-supported Ubuntu release.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TFL_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run check:topology-age
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify
      - run: npm run build
      - run: npm run test:e2e

  verify-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_NEXTBRANCH_API_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:ios
